name: office_worker
description: A Korean pixel-art idle career game for mobile.
publish_to: none
version: 0.2.0+2
environment:
  sdk: ^3.13.0
dependencies:
  crypto: ^3.0.7
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/content.json
    - assets/office-pixel.png
    - assets/sprites/
    - assets/fonts/OFL.txt
  fonts:
    - family: NeoDunggeunmo
      fonts:
        - asset: assets/fonts/neodgm.ttf

